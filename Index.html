<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --muted: #8a8a8e;
      --accent: #2f6fed;
      --extra: #e08a00;
      --extra-bg: #fff6e8;
      --extra-border: #f0c374;
      --ok: #1fa855;
      --danger: #e5484d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 110px;
    }
    header {
      background: var(--card);
      padding: 18px 16px 14px;
      border-bottom: 1px solid #e7e7ea;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 {
      font-size: 17px;
      margin: 0 0 2px;
    }
    header .date {
      font-size: 22px;
      font-weight: 700;
    }
    .name-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .name-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d8d8dc;
      border-radius: 10px;
      font-size: 15px;
    }
    main {
      padding: 14px 14px 0;
    }
    .section {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 14px 6px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .section.extra {
      background: var(--extra-bg);
      border: 1px solid var(--extra-border);
    }
    .section h2 {
      font-size: 15px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section.extra h2 { color: #8a5a00; }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 2px;
      border-bottom: 1px solid #eee;
    }
    .section.extra .item { border-bottom-color: #f2dca3; }
    .item:last-child { border-bottom: none; }
    .item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--accent);
    }
    .section.extra .item input[type="checkbox"] { accent-color: var(--extra); }
    .item .label-wrap { flex: 1; }
    .item .label { font-size: 15px; line-height: 1.4; }
    .item.checked .label { color: var(--muted); text-decoration: line-through; }
    .item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .ing-toggle {
      width: 100%;
      background: none;
      border: 1px dashed var(--extra-border);
      color: #8a5a00;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      margin: 6px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #ingredientList { display: none; }
    #ingredientList.open { display: block; }
    .progress-wrap {
      padding: 4px 2px 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .bar {
      height: 8px;
      border-radius: 6px;
      background: #e7e7ea;
      overflow: hidden;
      margin-top: 6px;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width .2s ease;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid #e7e7ea;
      z-index: 5;
    }
    .complete-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #c9c9cd;
    }
    .complete-btn.ready { background: var(--ok); }
    .done-banner {
      background: #eafaf0;
      border: 1px solid #b7ecc8;
      color: #146c2e;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      margin: 0 14px 14px;
      line-height: 1.5;
    }
    .done-banner button {
      background: none;
      border: none;
      color: #146c2e;
      text-decoration: underline;
      font-size: 13px;
      padding: 0;
      margin-top: 6px;
    }
    .sheet-link {
      display: block;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 8px 0 18px;
    }
  </style>
</head>
<body>

<header>
  <h1>백석직영점 마감 체크리스트</h1>
  <div class="date" id="dateLabel">-</div>
  <div class="name-row">
    <input id="nameInput" type="text" placeholder="이름을 입력하세요 (예: 홍길동)">
  </div>
</header>

<div id="doneBannerWrap"></div>

<main>
  <div class="section">
    <h2>✅ 필수 마감</h2>
    <div id="baseList"></div>
  </div>

  <div class="section extra">
    <h2>⚠️ 마감 후 추가로 확인</h2>
    <div id="extraList"></div>
    <button class="ing-toggle" id="ingToggle">
      <span>재료준비 <span id="ingCount">0/0</span></span>
      <span id="ingArrow">▼</span>
    </button>
    <div id="ingredientList"></div>
  </div>

  <div class="progress-wrap">
    전체 진행률 <span id="progressText">0/0</span>
    <div class="bar"><div class="bar-fill" id="progressBar"></div></div>
  </div>
  <a class="sheet-link" id="sheetLink" href="#" target="_blank" style="display:none;">📋 전체 기록 (구글시트) 보기</a>
</main>

<footer>
  <button class="complete-btn" id="completeBtn">전부 체크하면 완료할 수 있어요</button>
</footer>

<script>
  const KST_OPTS = { timeZone: 'Asia/Seoul' };
  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

  let itemDefs = null;
  let currentState = null;
  let todayKey = '';

  function computeTodayKey() {
    const now = new Date();
    const kstStr = now.toLocaleString('en-US', KST_OPTS);
    const d = new Date(kstStr);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return { key: `${y}-${m}-${day}`, month: d.getMonth() + 1, date: d.getDate(), weekday: WEEKDAYS[d.getDay()] };
  }

  function getName() {
    return document.getElementById('nameInput').value.trim();
  }

  function requireName() {
    const name = getName();
    if (!name) {
      alert('먼저 이름을 입력해주세요.');
      document.getElementById('nameInput').focus();
      return null;
    }
    return name;
  }

  function init() {
    const info = computeTodayKey();
    todayKey = info.key;
    document.getElementById('dateLabel').textContent = `${info.month}월 ${info.date}일 (${info.weekday})`;

    const savedName = localStorage.getItem('마감체크_이름');
    if (savedName) document.getElementById('nameInput').value = savedName;
    document.getElementById('nameInput').addEventListener('change', function () {
      localStorage.setItem('마감체크_이름', this.value.trim());
    });

    document.getElementById('ingToggle').addEventListener('click', function () {
      const list = document.getElementById('ingredientList');
      const open = list.classList.toggle('open');
      document.getElementById('ingArrow').textContent = open ? '▲' : '▼';
    });

    document.getElementById('completeBtn').addEventListener('click', onCompleteClick);

    google.script.run.withSuccessHandler(onItemDefs).getItemDefinitions();
    google.script.run.withSuccessHandler(function (url) {
      const a = document.getElementById('sheetLink');
      a.href = url;
      a.style.display = 'block';
    }).getSheetUrl();

    setInterval(refreshState, 6000);
  }

  function onItemDefs(defs) {
    itemDefs = defs;
    renderShell();
    refreshState();
  }

  function renderShell() {
    document.getElementById('baseList').innerHTML = itemDefs.base.map(renderItemHtml).join('');
    document.getElementById('extraList').innerHTML = itemDefs.extra.map(renderItemHtml).join('');
    document.getElementById('ingredientList').innerHTML = itemDefs.ingredient.map(renderItemHtml).join('');

    document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (cb) {
      cb.addEventListener('change', onCheckboxChange);
    });
  }

  function renderItemHtml(item) {
    return `
      <div class="item" id="item-${item.id}">
        <input type="checkbox" id="cb-${item.id}" data-id="${item.id}" data-label="${item.label}">
        <div class="label-wrap">
          <div class="label">${item.label}</div>
          <div class="meta" id="meta-${item.id}"></div>
        </div>
      </div>`;
  }

  function refreshState() {
    if (!itemDefs) return;
    google.script.run.withSuccessHandler(onState).getState(todayKey);
  }

  function onState(state) {
    currentState = state;
    const allItems = [].concat(itemDefs.base, itemDefs.extra, itemDefs.ingredient);
    let checkedCount = 0;

    allItems.forEach(function (item) {
      const c = state.checks[item.id];
      const cb = document.getElementById('cb-' + item.id);
      const row = document.getElementById('item-' + item.id);
      const meta = document.getElementById('meta-' + item.id);
      if (!cb) return;
      const isChecked = !!(c && c.checked);
      cb.checked = isChecked;
      cb.disabled = state.completed;
      row.classList.toggle('checked', isChecked);
      meta.textContent = isChecked && c.by ? `${c.by} · ${c.at}` : '';
      if (isChecked) checkedCount++;
    });

    const ingCheckedCount = itemDefs.ingredient.filter(function (it) {
      const c = state.checks[it.id];
      return c && c.checked;
    }).length;
    document.getElementById('ingCount').textContent = `${ingCheckedCount}/${itemDefs.ingredient.length}`;

    const total = allItems.length;
    document.getElementById('progressText').textContent = `${checkedCount}/${total}`;
    document.getElementById('progressBar').style.width = total ? (checkedCount / total * 100) + '%' : '0%';

    const btn = document.getElementById('completeBtn');
    if (state.completed) {
      btn.style.display = 'none';
    } else {
      btn.style.display = 'block';
      const ready = checkedCount === total;
      btn.classList.toggle('ready', ready);
      btn.textContent = ready ? '오늘 마감 완료하기' : `전부 체크하면 완료할 수 있어요 (${checkedCount}/${total})`;
    }

    renderDoneBanner(state);
  }

  function renderDoneBanner(state) {
    const wrap = document.getElementById('doneBannerWrap');
    if (!state.completed) {
      wrap.innerHTML = '';
      return;
    }
    wrap.innerHTML = `
      <div class="done-banner">
        ✅ 오늘(${state.date}) 마감 완료! (${state.completedAt})<br>
        참여: ${state.participants || '-'}
        <br><button id="undoBtn">완료 취소 (실수했을 때)</button>
      </div>`;
    document.getElementById('undoBtn').addEventListener('click', function () {
      if (!confirm('완료를 취소할까요? 다시 체크리스트를 수정할 수 있게 됩니다.')) return;
      google.script.run.withSuccessHandler(onState).uncompleteDay(todayKey);
    });
  }

  function onCheckboxChange(e) {
    const name = requireName();
    if (!name) {
      e.target.checked = !e.target.checked;
      return;
    }
    const id = e.target.getAttribute('data-id');
    const label = e.target.getAttribute('data-label');
    const checked = e.target.checked;
    e.target.disabled = true;
    google.script.run.withSuccessHandler(function (state) {
      onState(state);
    }).toggleItem(todayKey, id, label, checked, name);
  }

  function onCompleteClick() {
    const name = requireName();
    if (!name) return;
    if (!currentState) return;
    const allItems = [].concat(itemDefs.base, itemDefs.extra, itemDefs.ingredient);
    const allChecked = allItems.every(function (it) {
      const c = currentState.checks[it.id];
      return c && c.checked;
    });
    if (!allChecked) {
      alert('아직 체크 안 된 항목이 있어요.');
      return;
    }
    if (!confirm('오늘 마감을 완료 처리할까요?')) return;
    google.script.run.withSuccessHandler(function (res) {
      if (!res.ok) {
        alert(res.message);
        onState(res.state);
        return;
      }
      onState(res.state);
    }).completeDay(todayKey, name);
  }

  init();
</script>
</body>
</html>
